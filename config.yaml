# Setu configuration. Deterministic settings only in Week 1;
# model_router keys are stubbed for later weeks.

base_currency: USD          # net worth is normalized into this currency

paths:
  data_dir: data
  synthetic_dir: data/synthetic
  inbox_dir: data/inbox
  db_path: data/setu.db

thresholds:
  # Reconciliation: summed holdings may differ from a statement's stated total
  # by at most this fraction before the ToT reconciliation loop is triggered (Week 4).
  reconcile_tolerance: 0.005   # 0.5%

# FX rates anchored to the base currency (1 unit of KEY = value in base currency).
# Static table for the MVP; replaced by a live `fx` tool later. USD base → USD = 1.0.
fx_rates:
  USD: 1.0
  INR: 0.01203        # ~ 1 INR = 0.01203 USD  (USDINR ~= 83.1)

# Model routing per stage. `provider` picks local (Ollama) vs cloud (Claude);
# `model` names the concrete model — both swappable here with zero code change.
model_router:
  extraction:                 # PII-heavy: statement text → structured holdings. Stays LOCAL.
    provider: local
    model: qwen2.5:7b         # strong JSON/structured-output adherence; ~4.7GB on Apple Silicon
  classification:             # asset class / geography / policy type
    provider: claude
    model: claude-sonnet-5
  reasoning:                  # tool-calling loop, analysis, Q&A
    provider: claude
    model: claude-sonnet-5

# Local model (Ollama) connection.
ollama:
  host: http://localhost:11434
