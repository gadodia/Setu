[project]
name = "setu"
version = "0.1.0"
description = "Local-first cross-border wealth agent for US and India financial documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "gadodia" }]

# Final runtime: deterministic finance, local document interpretation, an explicit LangGraph
# workflow, a local dashboard, and an optional bounded Claude explanation loop.
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "reportlab>=5.0.0",
    "pdfplumber>=0.11.10",
    "anthropic>=0.120.2",
    "ollama>=0.6.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "python-multipart>=0.0.20",
    "markdown-it-py>=4.0",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=3.2.1",
    "paddleocr[doc-parser]>=3.4.0",
]

[project.scripts]
setu = "setu.cli:app"

[project.urls]
Repository = "https://github.com/gadodia/Setu"
Documentation = "https://github.com/gadodia/Setu#readme"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
